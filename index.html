<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08091B">
  <title>Төрсөн өдрийн мэнд ✦</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="nebula n1" aria-hidden="true"></div>
  <div class="nebula n2" aria-hidden="true"></div>
  <div class="aurora a1" aria-hidden="true"></div>
  <div class="aurora a2" aria-hidden="true"></div>
  <div class="mist" aria-hidden="true"></div>
  <div class="bokeh" id="bokeh" aria-hidden="true"></div>
  <div class="planet" aria-hidden="true"></div>
  <div class="sparks" aria-hidden="true"><i>✦</i><i>✧</i><i>✦</i><i>✧</i><i>✦</i><i>✧</i></div>
  <svg class="hills" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path class="h2" d="M0 70 C60 40 120 80 200 55 S340 35 400 60 V120 H0Z"/><path class="h1" d="M0 95 C70 70 130 105 210 85 S340 70 400 90 V120 H0Z"/></svg>
  <div class="moon" aria-hidden="true"></div>
  <div id="flash" aria-hidden="true"></div>

  <main>
    <!-- 0. Эхлэх: зүрхэн товч -->
    <section id="gate" class="scene active">
      <p class="rise" style="--d:.4s" id="gateTop"></p>
      <div class="halo rise" style="--d:.6s"><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i>
      <button id="heartBtn" class="heart-btn" type="button" aria-label="Эхлэх">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#F5C7E8"/>
              <stop offset="1" stop-color="#9b7bff"/>
            </linearGradient>
          </defs>
          <path fill="url(#hg)" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span id="heartLabel"></span>
      </button>
      </div>
      <p class="hint rise" style="--d:1.2s" id="gateHint"></p>
    </section>

    <!-- 1. Нууцлаг эхлэл -->
    <section id="intro" class="scene">
      <p class="kicker rise" style="--d:.4s" id="kicker"></p>
      <h1 class="intro-text rise" style="--d:1s" id="introText"></h1>
      <div class="orn rise" style="--d:3.4s" aria-hidden="true"><i></i><span>✦ ♡ ✦</span><i></i></div>
      <button id="openBtn" class="glow-btn rise" style="--d:3.6s" type="button"></button>
    </section>

    <!-- 2. Төрсөн өдрийн мэндчилгээ -->
    <section id="birthday" class="scene">
      <div class="glass" id="bdayText"></div>
      <button id="wishBtn" class="glow-btn rise" type="button"></button>
    </section>

    <!-- 3. Хүсэл -->
    <section id="wish" class="scene">
      <div class="orb" aria-hidden="true"></div>
      <p class="wish-1 rise" style="--d:1s" id="wish1"></p>
      <button id="wishDone" class="glow-btn rise" style="--d:3.2s" type="button"></button>
      <div class="wishend" id="wishEnd">
        <p class="wish-2 rise" style="--d:.4s" id="wish2"></p>
        <button id="replayBtn" class="glow-btn rise" style="--d:3s" type="button"></button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
